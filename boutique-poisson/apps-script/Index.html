<!DOCTYPE html>
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b4f6c">
<title>Ma Poissonnerie</title>
<style>
:root{
  --bg:#f2f6f8; --card:#ffffff; --ink:#10252f; --muted:#5d7380; --line:#dbe5ea;
  --brand:#0b4f6c; --brand-ink:#ffffff; --brand-soft:#e1f0f6; --side:#0b4f6c;
  --sales:#0b4f6c; --profit:#f2994a; --net:#2a9d8f;
  --ok:#1f8a5b; --ok-bg:#dcf3e8; --warn:#a86400; --warn-bg:#fdecc8; --bad:#b3261e; --bad-bg:#fbdad6;
  --radius:14px; --shadow:0 1px 2px rgba(16,37,47,.06),0 6px 18px rgba(16,37,47,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1a21; --card:#132630; --ink:#e8f1f5; --muted:#93a9b4; --line:#244150;
    --brand:#3aa6cf; --brand-ink:#04222e; --brand-soft:#173543; --side:#0e2a37;
    --sales:#3aa6cf; --profit:#f5a65b; --net:#4cc3b3;
    --ok:#5fd19b; --ok-bg:#12372a; --warn:#f3be5e; --warn-bg:#3b2f10; --bad:#ff8f86; --bad-bg:#431b18;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0c1a21; --card:#132630; --ink:#e8f1f5; --muted:#93a9b4; --line:#244150;
  --brand:#3aa6cf; --brand-ink:#04222e; --brand-soft:#173543; --side:#0e2a37;
  --sales:#3aa6cf; --profit:#f5a65b; --net:#4cc3b3;
  --ok:#5fd19b; --ok-bg:#12372a; --warn:#f3be5e; --warn-bg:#3b2f10; --bad:#ff8f86; --bad-bg:#431b18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;padding:6px 10px 16px;font-weight:700;font-size:18px}
.logo svg{width:34px;height:34px;flex:none}
.side button.nav{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;border-radius:10px;background:transparent;color:inherit;cursor:pointer;text-align:left;font-weight:500;transition:background .2s,transform .1s}
.side button.nav:hover{background:rgba(255,255,255,.12)}
.side button.nav.on{background:rgba(255,255,255,.22);font-weight:700}
.side .sp{flex:1}
.nav svg,.bnav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
main{padding:22px 26px 40px;max-width:1180px;width:100%;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:26px}
.top .sub{color:var(--muted);font-size:14px}
.bnav{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card h2{font-size:17px;margin-bottom:4px}
.card .hint{color:var(--muted);font-size:13px;margin-bottom:10px}
.grid{display:grid;gap:14px}
.grid>*,.card{min-width:0}
main{min-width:0}
.app>main{overflow-x:clip}
.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kpi{position:relative;overflow:hidden}
.kpi .l{font-size:13px;color:var(--muted);font-weight:600}
.kpi .v{font-size:24px;white-space:nowrap;font-weight:800;margin-top:4px;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;font-weight:600;color:var(--muted)}
.kpi .d{font-size:12.5px;margin-top:2px;color:var(--muted)}
.kpi .d.up{color:var(--ok)} .kpi .d.down{color:var(--bad)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c,var(--brand))}
.two{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)} .three{grid-template-columns:repeat(3,minmax(0,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:11px;padding:11px 16px;background:var(--brand);color:var(--brand-ink);font-weight:700;cursor:pointer;transition:transform .08s,filter .2s,box-shadow .2s;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.btn:hover{filter:brightness(1.07)} .btn:active{transform:translateY(1px) scale(.98)}
.btn.sec{background:var(--brand-soft);color:var(--brand);box-shadow:none}
.btn.ghost{background:transparent;color:var(--brand);box-shadow:none;border:1px solid var(--line)}
.btn.danger{background:var(--bad-bg);color:var(--bad);box-shadow:none}
.btn.big{padding:15px 18px;font-size:17px;width:100%}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;pointer-events:none}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px}
label.f>span{display:block;margin-bottom:4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);outline:none;transition:border .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.row{display:flex;gap:10px;flex-wrap:wrap} .row>*{flex:1 1 140px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--card);padding:7px 13px;border-radius:99px;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted);transition:all .15s;white-space:nowrap}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.bas{background:var(--warn-bg);color:var(--warn)} .badge.rupture{background:var(--bad-bg);color:var(--bad)} .badge.neutre{background:var(--brand-soft);color:var(--muted)} .badge.neutral{background:var(--brand-soft);color:var(--brand)}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:hover td{background:color-mix(in srgb,var(--brand-soft) 45%,transparent)}
.scroll{overflow-x:auto}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pcard{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 11px;text-align:left;cursor:pointer;transition:transform .12s,box-shadow .2s,border .2s;display:flex;flex-direction:column;gap:3px;min-height:92px;animation:pop .35s both}
.pcard:hover{box-shadow:var(--shadow);border-color:var(--brand)} .pcard:active{transform:scale(.97)}
.pcard .nm{font-weight:700;font-size:14px;line-height:1.25}
.pcard .pr{color:var(--brand);font-weight:800}
.pcard .st{font-size:12px;color:var(--muted);margin-top:auto}
.pcard.out{opacity:.62}
.salewrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.salewrap>div{min-width:0}
.cart{position:sticky;top:14px}
.line{display:grid;grid-template-columns:1fr 70px 92px 28px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.line .nm{font-weight:600;font-size:14px}
.line input{padding:7px 8px;text-align:right}
.line .sacrow{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.bline{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px;background:color-mix(in srgb,var(--brand-soft) 30%,var(--card))}
.bline .brow1{display:flex;gap:6px;align-items:center} .bline .brow1 .x{border:0;background:transparent;color:var(--bad);font-size:22px;cursor:pointer;padding:0 6px}
.bline .brow2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:6px}
.bline .brow2 label{font-size:11.5px;font-weight:600;color:var(--muted);margin:0} .bline .brow2 input,.bline .brow2 select{padding:7px 8px;margin-top:2px;font-size:14px}
.bline .bsum{font-size:12.5px;color:var(--muted);margin-top:6px;min-height:16px}
@media(max-width:560px){.bline .brow2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chip.sm{padding:3px 10px;font-size:12.5px}
.sacrow label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600;margin:0}
.sacrow label input{width:76px;padding:5px 7px}
.sacrow .eq{font-size:12.5px;font-weight:700;color:var(--brand)}
.line .x{border:0;background:transparent;color:var(--bad);font-size:20px;cursor:pointer}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin-top:12px}
.sub2{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}
.empty{padding:26px;text-align:center;color:var(--muted)}
.cartbar{display:none}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#10252f;color:#fff;padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:99;max-width:92vw;animation:toast .35s both;font-weight:600}
.toast.err{background:var(--bad);color:#fff}
.modal{position:fixed;inset:0;background:rgba(5,20,28,.55);display:flex;align-items:flex-end;justify-content:center;z-index:60;animation:fade .2s both}
.modal .box{background:var(--card);width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px;animation:slide .28s both}
@media(min-width:700px){.modal{align-items:center}.modal .box{border-radius:20px}}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;font-weight:600;margin:4px 0 8px}
.legend i{display:inline-block;width:14px;height:14px;border:1px solid #000;margin-right:6px;vertical-align:-2px;border-radius:3px}
.hbar{display:grid;grid-template-columns:minmax(100px,32%) 1fr minmax(84px,auto);gap:10px;align-items:center;margin:7px 0;font-size:14px}
.hbar .t{background:var(--brand-soft);border-radius:6px;height:24px}
.hbar .b{height:100%;border:1px solid #000;border-radius:6px;transform-origin:left;animation:growx .7s both;min-width:2px}
.hbar .vl{font-weight:800;font-size:13.5px;text-align:right;white-space:nowrap}
.chart text{fill:var(--ink)} .chart .mut{fill:var(--muted)} .chart .gl{stroke:var(--line)} .chart .ax{stroke:var(--ink)}
.skel{background:linear-gradient(90deg,var(--line),var(--brand-soft),var(--line));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:10px;height:84px}
.alert{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.banner.act{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cnt{display:inline-block;background:var(--bad);color:#fff;border-radius:99px;padding:0 7px;font-size:12px;margin-left:4px}
.nb{background:var(--bad);color:#fff;border-radius:99px;padding:0 6px;font-size:11px;font-weight:700;margin-left:auto;min-width:18px;text-align:center}
.bnav button{position:relative} .bnav .nb{position:absolute;top:0;right:22%;margin:0}
@media(max-width:700px){.hide-m{display:none}}
.banner{background:var(--warn-bg);color:var(--warn);padding:8px 14px;border-radius:10px;font-weight:600;margin-bottom:14px;font-size:14px}
.view{animation:fade .35s backwards}
.kpis .card{animation:rise .5s both} .kpis .card:nth-child(2){animation-delay:.05s}.kpis .card:nth-child(3){animation-delay:.1s}.kpis .card:nth-child(4){animation-delay:.15s}.kpis .card:nth-child(5){animation-delay:.2s}.kpis .card:nth-child(6){animation-delay:.25s}
.bar rect.pos{transform-box:fill-box;transform-origin:bottom;animation:growy .7s both}
.bar rect.neg{transform-box:fill-box;transform-origin:top;animation:growy .7s both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes toast{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media(max-width:900px){
  .app{display:block}
  .side{display:none}
  main{padding:14px 14px 150px}
  .top h1{font-size:22px}
  .two,.three{grid-template-columns:minmax(0,1fr)}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:50;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.08)}
  .bnav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);padding:5px 0;cursor:pointer;border-radius:10px}
  .bnav button.on{color:var(--brand)}
  .salewrap{display:block}
  .cart{position:fixed;top:auto;left:0;right:0;bottom:0;z-index:70;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .3s;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .cart.open{transform:none}
  .cartbar{display:flex;position:fixed;left:12px;right:12px;bottom:76px;z-index:55;background:var(--brand);color:var(--brand-ink);border-radius:14px;padding:13px 16px;justify-content:space-between;font-weight:800;box-shadow:var(--shadow);border:0;cursor:pointer;animation:rise .3s both}
  .cartbar.hide{display:none}
  .toast{bottom:150px}
  .line{grid-template-columns:1fr 64px 84px 26px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main id="main"><div class="skel"></div></main>
</div>
<nav class="bnav" id="bnav"></nav>
<div id="overlay"></div>

<script>
/* ===================== Utilitaires ===================== */
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
var nf = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 });
var nf1 = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 1 });
var nf3 = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 3 });
function moneyHtml(n) { return nf.format(Math.round(n || 0)) + '<small> FCFA</small>'; }
function money(n) { return nf.format(Math.round(n || 0)) + ' FCFA'; }
function qty(n) { return nf3.format(n || 0); }
function compact(n) {
  var a = Math.abs(n), s = n < 0 ? '-' : '';
  if (a >= 1e6) return s + nf1.format(a / 1e6) + ' M';
  if (a >= 1e3) return s + nf1.format(a / 1e3) + ' k';
  return s + nf.format(a);
}
function pad(n) { return (n < 10 ? '0' : '') + n; }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function today() { return ymd(new Date()); }
function parse(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function addDays(s, n) { var d = parse(s); d.setDate(d.getDate() + n); return ymd(d); }
function frDate(s) { return parse(s).toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }); }
function frShort(s) { return parse(s).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }); }
function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function api(action, args) {
  return new Promise(function (resolve, reject) {
    if (window.google && google.script && google.script.run) {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) { reject(new Error((e && e.message) || String(e))); }).api(action, args || {});
    } else if (window.DEMO_API) { window.DEMO_API(action, args || {}).then(resolve, reject); }
    else reject(new Error('Serveur indisponible'));
  });
}
function toast(msg, err) {
  var t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; document.body.appendChild(t);
  setTimeout(function () { t.style.transition = 'opacity .3s'; t.style.opacity = 0; setTimeout(function () { t.remove(); }, 300); }, err ? 5000 : 2600);
}
function countUp(el, to) {
  var from = 0, t0 = performance.now(), dur = 650;
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) { el.innerHTML = moneyHtml(to); return; }
  (function step(t) { var k = Math.min((t - t0) / dur, 1), e = 1 - Math.pow(1 - k, 3); el.innerHTML = moneyHtml(from + (to - from) * e); if (k < 1) requestAnimationFrame(step); })(t0);
}
function modal(html, onMount) {
  var o = $('#overlay'); o.innerHTML = '<div class="modal"><div class="box">' + html + '</div></div>';
  var m = $('.modal', o);
  m.addEventListener('mousedown', function (e) { if (e.target === m) closeModal(); });
  if (onMount) onMount(m);
  return m;
}
function closeModal() { $('#overlay').innerHTML = ''; }
function busy(btn, fn) {
  btn.disabled = true; var t = btn.textContent;
  return fn().catch(function (e) { toast(e.message, true); }).then(function (r) { btn.disabled = false; return r; });
}

/* ===================== Graphiques ===================== */
function niceStep(raw) { var p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function barChart(labels, series, opt) {
  opt = opt || {};
  var n = labels.length, W = Math.max(340, n * (series.length * 26 + 22) + 70), H = 270, L = 52, R = 10, T = 22, B = 44;
  var all = []; series.forEach(function (s) { s.values.forEach(function (v) { all.push(v); }); });
  var dmax = Math.max.apply(null, all.concat([0])), dmin = Math.min.apply(null, all.concat([0]));
  var step = niceStep(Math.max((dmax - dmin) / 4, 1)), lo = Math.floor(dmin / step) * step, hi = Math.ceil(dmax / step) * step;
  if (hi === lo) hi = lo + step;
  var span = hi - lo, pw = W - L - R, ph = H - T - B;
  var y = function (v) { return T + ph - (v - lo) / span * ph; };
  var g = '';
  for (var v0 = lo; v0 <= hi + step / 2; v0 += step) {
    var yy = y(v0);
    g += '<line class="gl" x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" stroke-width="1"/>' +
         '<text class="mut" x="' + (L - 6) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="11">' + compact(v0) + '</text>';
  }
  var gw = pw / n, bw = Math.min(34, (gw - 10) / series.length), out = '';
  labels.forEach(function (lb, i) {
    var gx = L + gw * i + (gw - bw * series.length) / 2;
    series.forEach(function (s, k) {
      var v = s.values[i], x = gx + bw * k, y0 = y(0), y1 = y(v), h = Math.abs(y1 - y0);
      out += '<rect class="' + (v >= 0 ? 'pos' : 'neg') + '" x="' + x + '" y="' + Math.min(y0, y1) + '" width="' + bw + '" height="' + Math.max(h, v === 0 ? 0 : 1) + '" stroke="#000" stroke-width="1" rx="2" style="fill:' + s.color + ';animation-delay:' + (i * 30) + 'ms"><title>' + esc(s.name + ' : ' + money(v)) + '</title></rect>';
      if (n <= 14 && v !== 0) out += '<text x="' + (x + bw / 2) + '" y="' + (v >= 0 ? y1 - 5 : y1 + 13) + '" text-anchor="middle" font-size="' + (series.length > 2 ? 9 : 10.5) + '" font-weight="700">' + compact(v) + '</text>';
    });
    out += '<text x="' + (L + gw * i + gw / 2) + '" y="' + (H - B + 18) + '" text-anchor="middle" font-size="11.5">' + esc(lb) + '</text>';
  });

/* ----- Bon d'achat : recopier un reçu de grossiste ligne par ligne ----- */
function bonCalc(l) {
  var p = S.data.produits.filter(function (x) { return x.actif && norm(x.nom) === norm(l.name); })[0];
  var nb = num(l.nb), ct = num(l.ct), pr = num(l.prix), r = { p: p, nb: nb, ct: ct, qte: 0, pu: 0, montant: 0, ok: false, msg: '' };
  if (!String(l.name).trim() && !nb && !pr) { r.empty = true; return r; }
  if (!p) { r.msg = 'Produit non reconnu : choisissez-le dans la liste proposée.'; return r; }
  r.qte = ct > 0 ? nb * ct : nb;
  if (l.basis === 'carton') { if (!(ct > 0)) { r.msg = 'Indiquez le contenu d\'un ' + packWords(p).pack + ' ou carton.'; return r; } r.pu = pr / ct; }
  else if (l.basis === 'unite') r.pu = pr;
  else r.pu = r.qte ? pr / r.qte : 0;
  r.montant = r.qte * r.pu; r.ok = nb > 0 && r.pu > 0;
  if (!r.ok) r.msg = 'Indiquez la quantité et le prix.';
  return r;
}
function bonStockInfo(r, i) {
  var s = stockById(r.p.id); if (!s) return '';
  var prior = 0, k, rk;
  for (k = 0; k < i; k++) { rk = bonCalc(S.bon.lines[k]); if (rk.ok && rk.p.id === r.p.id) prior += rk.qte; }
  var before = Math.round((s.stock + prior) * 1000) / 1000, after = Math.round((before + r.qte) * 1000) / 1000;
  return '<div style="margin-top:2px">Stock : <b>' + qty(before) + ' → ' + qty(after) + ' ' + esc(r.p.unite) + '</b>' + (s.venteJour > 0 ? ' (≈ ' + qty(Math.round(after / s.venteJour)) + ' jour(s) de vente)' : '') + (prior ? ' <small>(cumul avec une ligne précédente du même produit)</small>' : '') + '</div>';
}
function bonLineSummary(l, i) {
  var r = bonCalc(l); if (r.empty) return '';
  if (!r.ok) return '<span style="color:var(--bad)">' + esc(r.msg) + '</span>';
  var u = r.p.unite, pv = r.p.prixVente;
  return '= <b>' + qty(r.qte) + ' ' + esc(u) + '</b> · ' + nf2.format(r.pu) + ' F / ' + esc(u) + ' · <b>' + money(r.montant) + '</b>' +
    (pv > 0 ? ' · vente ' + nf.format(pv) + ' F → bénéfice prévu <b style="color:' + (pv >= r.pu ? 'var(--ok)' : 'var(--bad)') + '">' + money((pv - r.pu) * r.qte) + '</b>' : ' · <span style="color:var(--warn)">prix de vente non renseigné</span>') + bonStockInfo(r, i);
}
function refreshBonSums() { S.bon.lines.forEach(function (l, i) { var e = $('#bs' + i); if (e) e.innerHTML = bonLineSummary(l, i); }); var t = $('#btotbon'); if (t) t.textContent = money(bonTotal()); }
function bonTotal() { var t = 0; S.bon.lines.forEach(function (l) { var r = bonCalc(l); if (r.ok) t += r.montant; }); return t; }
function drawBonLines() {

/* ----- Fiche de stock ----- */
function lineChart(pts, unit) {
  var n = pts.length, W = Math.max(340, Math.min(n * 46 + 80, 900)), H = 220, L = 52, R = 14, T = 22, B = 40;
  var ys = pts.map(function (p) { return p.y; }), dmax = Math.max.apply(null, ys.concat([0])), dmin = Math.min.apply(null, ys.concat([0]));
  var step = niceStep(Math.max((dmax - dmin) / 4, 1)), lo = Math.floor(dmin / step) * step, hi = Math.ceil(dmax / step) * step; if (hi === lo) hi = lo + step;
  var pw = W - L - R, ph = H - T - B, y = function (v) { return T + ph - (v - lo) / (hi - lo) * ph; }, x = function (i) { return L + (n === 1 ? pw / 2 : 22 + (pw - 44) * i / (n - 1)); };
  var g = '', v0;
  for (v0 = lo; v0 <= hi + step / 2; v0 += step) g += '<line class="gl" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v0) + '" y2="' + y(v0) + '" stroke-width="1"/><text class="mut" x="' + (L - 6) + '" y="' + (y(v0) + 4) + '" text-anchor="end" font-size="11">' + compact(v0) + '</text>';
  var path = pts.map(function (p, i) { return (i ? 'L' : 'M') + x(i) + ' ' + y(p.y); }).join(' '), dots = '', labs = '', every = Math.ceil(n / 8), maxI = ys.indexOf(Math.max.apply(null, ys));
  pts.forEach(function (p, i) {
    dots += '<circle cx="' + x(i) + '" cy="' + y(p.y) + '" r="4" fill="var(--sales)" stroke="#000" stroke-width="1"><title>' + esc(p.x + ' : ' + qty(p.y) + ' ' + unit) + '</title></circle>';
    if (n <= 10 || i === n - 1 || i === 0 || i === maxI) labs += '<text x="' + x(i) + '" y="' + (y(p.y) - 9) + '" text-anchor="middle" font-size="11" font-weight="700">' + qty(p.y) + '</text>';
    if (i % every === 0 || i === n - 1) labs += '<text x="' + x(i) + '" y="' + (H - B + 18) + '" text-anchor="middle" font-size="11">' + esc(p.x) + '</text>';
  });
  return '<div class="chart scroll"><div style="min-width:' + Math.min(W, 900) + 'px"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Niveau de stock dans le temps">' + g +
    '<line class="ax" x1="' + L + '" x2="' + L + '" y1="' + T + '" y2="' + (T + ph) + '" stroke-width="1.4"/><line class="ax" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke-width="1.4"/>' +
    '<text class="mut" x="' + L + '" y="12" font-size="11">' + esc(unit) + '</text><path d="' + path + '" fill="none" style="stroke:var(--sales)" stroke-width="2.5"/>' + dots + labs + '</svg></div></div>';
}

/* ===================== Dépenses ===================== */
function vExpenses(w) {
  var from = today().slice(0, 8) + '01';
  w.innerHTML = head('Dépenses', 'Électricité, glace, transport, loyer, salaires… (déduits du bénéfice net)') +
    '<div class="grid two"><div class="card"><h2>Nouvelle dépense</h2>' +
    '<div class="row"><label class="f"><span>Date</span>' + dateInput('ed', today()) + '</label><label class="f"><span>Montant (FCFA)</span><input id="em" type="number" inputmode="decimal" step="any" min="0"></label></div>' +
    '<label class="f"><span>Catégorie</span><select id="ec">' + S.data.depenseCategories.map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('') + '</select></label>' +
    '<label class="f"><span>Libellé</span><input id="el" placeholder="Ex : facture d\'électricité d\'octobre"></label>' +
    '<button class="btn big" id="es">Enregistrer la dépense</button></div>' +
    '<div class="card"><h2>Ce mois-ci</h2><div class="hint">Répartition par catégorie</div><div id="ebreak"><div class="skel"></div></div></div></div>' +
    '<div class="card scroll" style="margin-top:14px" id="elist"></div>';
  $('#es').onclick = function () {
    if (!(parseFloat($('#em').value) > 0)) return toast('Indiquez un montant.', true);
    busy($('#es'), function () { return api('addExpense', { date: $('#ed').value, categorie: $('#ec').value, libelle: $('#el').value, montant: $('#em').value }).then(function () { toast('✅ Dépense enregistrée'); return refresh(); }); });
  };
  Promise.all([api('report', { from: from, to: today() }), api('history', { table: 'Depenses', from: from, to: today() })]).then(function (r) {
    var rep = r[0], rows = r[1];
    $('#ebreak').innerHTML = hBars(rep.depensesParCategorie, 'var(--profit)', 'montant', 'categorie', rep.totaux.depenses) + '<div class="tot"><span>Total du mois</span><span>' + money(rep.totaux.depenses) + '</span></div>';
    $('#elist').innerHTML = rows.length ? '<table><thead><tr><th>Date</th><th>Catégorie</th><th>Libellé</th><th class="n">Montant</th><th></th></tr></thead><tbody>' + rows.map(function (x) { return '<tr><td>' + frShort(x.date) + '</td><td>' + esc(x.categorie) + '</td><td>' + esc(x.libelle) + '</td><td class="n"><b>' + nf.format(x.montant) + '</b></td><td><button class="btn sm danger" data-del="' + x.id + '">Suppr.</button></td></tr>'; }).join('') + '</tbody></table>' : '<div class="empty">Aucune dépense ce mois-ci.</div>';
    $$('[data-del]', w).forEach(function (b) { b.onclick = function () { if (confirm('Supprimer cette dépense ?')) busy(b, function () { return api('remove', { table: 'Depenses', id: b.dataset.del }).then(function () { toast('Supprimée'); return refresh(); }); }); }; });
  }).catch(function (e) { toast(e.message, true); });
}

/* ===================== Rapports ===================== */
function presetRange(k) {
  var t = today(), d = parse(t);
  if (k === '1') return [t, t];
  if (k === '7') return [addDays(t, -6), t];
  if (k === 'm') return [t.slice(0, 8) + '01', t];
  if (k === 'pm') { var a = new Date(d.getFullYear(), d.getMonth() - 1, 1), b = new Date(d.getFullYear(), d.getMonth(), 0); return [ymd(a), ymd(b)]; }
  if (k === '30') return [addDays(t, -29), t];
  if (k === 'y') return [d.getFullYear() + '-01-01', t];
  return [S.rep.from, S.rep.to];
}
function vReports(w) {
  var P = [['1', "Aujourd'hui"], ['7', '7 jours'], ['30', '30 jours'], ['m', 'Ce mois'], ['pm', 'Mois dernier'], ['y', 'Cette année'], ['c', 'Personnalisé']];
  w.innerHTML = head('Rapports', 'Chiffre d\'affaires, bénéfices et performances par période', '<button class="btn sec" id="csv">Exporter en CSV</button>') +
    '<div class="chips">' + P.map(function (p) { return '<button class="chip' + (S.rep.preset === p[0] ? ' on' : '') + '" data-pr="' + p[0] + '">' + p[1] + '</button>'; }).join('') + '</div>' +
    '<div class="row" id="custom" style="' + (S.rep.preset === 'c' ? '' : 'display:none') + ';margin-bottom:10px"><label class="f"><span>Du</span>' + dateInput('rf', S.rep.from) + '</label><label class="f"><span>Au</span>' + dateInput('rt', S.rep.to) + '</label></div>' +
    '<div id="rbody"><div class="skel"></div></div>';
  var last = null;
  $$('[data-pr]', w).forEach(function (b) { b.onclick = function () { S.rep.preset = b.dataset.pr; if (S.rep.preset !== 'c') { var r = presetRange(S.rep.preset); S.rep.from = r[0]; S.rep.to = r[1]; } vReports(w); }; });
  if (S.rep.preset === 'c') { $('#rf').onchange = function () { S.rep.from = this.value; load(); }; $('#rt').onchange = function () { S.rep.to = this.value; load(); }; }
  $('#csv').onclick = function () {
    if (!last) return;
    var rows = [['Date', "Chiffre d'affaires", 'Bénéfice brut', 'Dépenses', 'Pertes', 'Bénéfice net']].concat(last.jours.map(function (d) { return [d.date, d.ca, d.marge, d.depenses, d.pertes, d.net]; }));
    rows.push([], ['Produit', 'Catégorie', 'Quantité', "Chiffre d'affaires", 'Bénéfice brut']);
    last.produits.forEach(function (p) { rows.push([p.produit, p.categorie, p.qte, p.ca, p.marge]); });
    var csv = '﻿' + rows.map(function (r) { return r.map(function (c) { return '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"'; }).join(';'); }).join('\n');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = 'rapport_' + S.rep.from + '_' + S.rep.to + '.csv'; a.click();
  };
  function load() {
    if (S.rep.from > S.rep.to) return toast('La date de début est postérieure à la date de fin.', true);
    api('report', { from: S.rep.from, to: S.rep.to }).then(function (r) {
      last = r; var T = r.totaux, ag = aggregate(daysBetween(r.from, r.to) <= 400 ? fillDays(r.jours, r.from, r.to) : r.jours);
      $('#rbody').innerHTML = '<div class="card" style="margin-bottom:14px"><b>Période :</b> ' + frDate(r.from) + ' → ' + frDate(r.to) + ' · ' + T.tickets + ' vente' + (T.tickets > 1 ? 's' : '') + ' · panier moyen ' + money(T.panierMoyen) + '</div>' +
        '<div class="grid kpis">' + kpi("Chiffre d'affaires", T.ca, 'var(--sales)') + kpi('Bénéfice brut', T.marge, 'var(--profit)', '<div class="d">Taux de marge : ' + T.tauxMarge + ' %</div>') + kpi('Dépenses', T.depenses, 'var(--bad)') + kpi('Pertes', T.pertes, 'var(--bad)') + kpi('Bénéfice net', T.net, 'var(--net)') + kpi('Achats de la période', T.achats, 'var(--muted)', T.credit ? '<div class="d">Crédits clients : ' + money(T.credit) + '</div>' : '') + '</div>' +
        '<div class="card" style="margin-top:14px"><h2>Évolution par ' + ag.unit + '</h2><div class="hint">Chiffre d\'affaires, bénéfice brut et bénéfice net (FCFA)</div>' +
          barChart(ag.labels, [{ name: "Chiffre d'affaires", color: 'var(--sales)', values: ag.rows.map(function (x) { return x.ca; }) }, { name: 'Bénéfice brut', color: 'var(--profit)', values: ag.rows.map(function (x) { return x.marge; }) }, { name: 'Bénéfice net', color: 'var(--net)', values: ag.rows.map(function (x) { return x.net; }) }], { title: 'Évolution' }) + '</div>' +
        '<div class="grid two" style="margin-top:14px"><div class="card"><h2>Produits les plus rentables</h2><div class="hint">Bénéfice brut (FCFA)</div>' + hBars(r.produits.slice().sort(function (a, b) { return b.marge - a.marge; }).slice(0, 8), 'var(--profit)', 'marge', 'produit', T.marge) + '</div>' +
        '<div class="card"><h2>Chiffre d\'affaires par catégorie</h2><div class="hint">FCFA</div>' + hBars(r.categories.slice(0, 8), 'var(--sales)', 'ca', 'categorie', T.ca) + '</div></div>' +
        '<div class="card scroll" style="margin-top:14px"><h2>Détail par produit</h2><table><thead><tr><th>Produit</th><th class="n">Quantité</th><th class="n">CA</th><th class="n">Bénéfice</th><th class="n">Marge</th><th class="n">Part du CA</th></tr></thead><tbody>' +
          (r.produits.length ? r.produits.map(function (p) { return '<tr><td>' + esc(p.produit) + '</td><td class="n">' + qty(p.qte) + '</td><td class="n">' + nf.format(p.ca) + '</td><td class="n"><b>' + nf.format(p.marge) + '</b></td><td class="n">' + (p.ca ? Math.round(p.marge / p.ca * 100) : 0) + ' %</td><td class="n">' + (T.ca ? Math.round(p.ca / T.ca * 100) : 0) + ' %</td></tr>'; }).join('') : '<tr><td colspan="6" class="empty">Aucune vente sur la période.</td></tr>') + '</tbody></table></div>' +
        (r.paiements.length ? '<div class="card" style="margin-top:14px"><h2>Modes de paiement</h2><div class="hint">Chiffre d\'affaires (FCFA)</div>' + hBars(r.paiements, 'var(--net)', 'ca', 'mode', T.ca) + '</div>' : '');
      $$('#rbody .kpi .v').forEach(function (el) { countUp(el, +el.dataset.v); });
    }).catch(function (e) { $('#rbody').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
  }
  load();
}
function daysBetween(a, b) { return Math.round((parse(b) - parse(a)) / 864e5); }

/* ===================== Historique ===================== */
function vHistory(w) {
  var H = S.hist, T = [['Ventes', 'Ventes'], ['Achats', 'Achats'], ['Depenses', 'Dépenses'], ['Pertes', 'Pertes'], ['Ajustements', 'Stock initial / inventaire']];
  w.innerHTML = head('Historique', 'Consulter, corriger (supprimer puis ressaisir) ou régler un crédit') +
    '<div class="chips">' + T.map(function (t) { return '<button class="chip' + (H.table === t[0] ? ' on' : '') + '" data-t="' + t[0] + '">' + t[1] + '</button>'; }).join('') + '</div>' +
    '<div class="row" style="margin-bottom:10px"><label class="f"><span>Du</span>' + dateInput('hf', H.from) + '</label><label class="f"><span>Au</span>' + dateInput('ht', H.to) + '</label>' +
    (H.table === 'Ventes' ? '<label class="f"><span>Filtre</span><select id="hc"><option value="0">Toutes les ventes</option><option value="1"' + (H.credit ? ' selected' : '') + '>Crédits non réglés</option></select></label>' : '') + '</div>' +
    '<div class="card scroll" id="hl"><div class="skel"></div></div>';
  $$('[data-t]', w).forEach(function (b) { b.onclick = function () { H.table = b.dataset.t; vHistory(w); }; });
  $('#hf').onchange = function () { H.from = this.value; vHistory(w); }; $('#ht').onchange = function () { H.to = this.value; vHistory(w); };
  var hc = $('#hc'); if (hc) hc.onchange = function () { H.credit = this.value === '1'; vHistory(w); };
  var cols = {
    Ventes: [['Date', function (r) { return frShort(r.date); }], ['Produit', function (r) { return esc(r.produit) + (r.note ? '<div style="font-size:12px;color:var(--muted)">' + esc(r.note) + '</div>' : ''); }], ['Qté', function (r) { return qty(r.qte) + (r.nbSacs ? '<div style="font-size:12px;color:var(--muted)">' + qty(r.nbSacs) + ' × ' + qty(r.kgSac) + '</div>' : ''); }, 1], ['PU', function (r) { return nf1.format(r.pu); }, 1], ['Total', function (r) { return '<b>' + nf.format(r.qte * r.pu) + '</b>'; }, 1], ['Bénéf.', function (r) { return nf.format(r.qte * (r.pu - r.cout)); }, 1], ['Paiement', function (r) { return r.paiement === 'Crédit' ? '<span class="badge bas">Crédit</span>' : esc(r.paiement); }]],
    Achats: [['Date', function (r) { return frShort(r.date); }], ['Produit', function (r) { return esc(r.produit) + (r.fournisseur ? '<div style="font-size:12px;color:var(--muted)">' + esc(r.fournisseur) + '</div>' : ''); }], ['Sacs / cartons', function (r) { return r.nbSacs ? qty(r.nbSacs) + ' × ' + qty(r.kgSac) : '—'; }], ['Qté', function (r) { return qty(r.qte); }, 1], ['PU achat', function (r) { return nf2.format(r.pu); }, 1], ['Total', function (r) { return '<b>' + nf.format(r.qte * r.pu) + '</b>'; }, 1], ['Bénéf. prévu', function (r) { var p = prodById(r.produitId); return p && p.prixVente > 0 ? nf.format((p.prixVente - r.pu) * r.qte) : '—'; }, 1]],
    Depenses: [['Date', function (r) { return frShort(r.date); }], ['Catégorie', function (r) { return esc(r.categorie); }], ['Libellé', function (r) { return esc(r.libelle); }], ['Montant', function (r) { return '<b>' + nf.format(r.montant) + '</b>'; }, 1]],
    Ajustements: [['Date', function (r) { return frShort(r.date); }], ['Produit', function (r) { return esc(r.produit); }], ['Quantité ajoutée', function (r) { return '<b>+' + qty(r.qte) + '</b>'; }, 1], ['Motif', function (r) { return esc(r.motif); }], ['Coût unitaire', function (r) { return r.cout ? nf2.format(r.cout) : '<span style="color:var(--bad)">à renseigner</span>'; }, 1]],
    Pertes: [['Date', function (r) { return frShort(r.date); }], ['Produit', function (r) { return esc(r.produit); }], ['Qté', function (r) { return qty(r.qte); }, 1], ['Motif', function (r) { return esc(r.motif); }], ['Valeur', function (r) { return '<b>' + nf.format(r.qte * r.cout) + '</b>'; }, 1]]
  }[H.table];
  api('history', { table: H.table, from: H.from, to: H.to }).then(function (rows) {
    if (H.table === 'Ventes' && H.credit) rows = rows.filter(function (r) { return r.paiement === 'Crédit'; });
    $('#hl').innerHTML = rows.length ? '<table><thead><tr>' + cols.map(function (c) { return '<th class="' + (c[2] ? 'n' : '') + '">' + c[0] + '</th>'; }).join('') + '<th></th></tr></thead><tbody>' +
      rows.map(function (r) { return '<tr>' + cols.map(function (c) { return '<td class="' + (c[2] ? 'n' : '') + '">' + c[1](r) + '</td>'; }).join('') + '<td style="white-space:nowrap">' + (H.table === 'Ventes' && r.paiement === 'Crédit' ? '<button class="btn sm sec" data-settle="' + r.id + '">Réglé</button> ' : '') + '<button class="btn sm danger" data-del="' + r.id + '">Suppr.</button></td></tr>'; }).join('') + '</tbody></table>' + (rows.length >= 500 ? '<div class="empty">Affichage limité aux 500 plus récents : réduisez la période.</div>' : '') : '<div class="empty">Aucun enregistrement sur la période.</div>';
    $$('[data-del]', w).forEach(function (b) { b.onclick = function () { if (confirm('Supprimer définitivement cet enregistrement ? Le stock et les bénéfices seront recalculés.')) busy(b, function () { return api('remove', { table: H.table, id: b.dataset.del }).then(function () { toast('Supprimé'); return refresh(); }); }); }; });
    $$('[data-settle]', w).forEach(function (b) { b.onclick = function () { busy(b, function () { return api('settleCredit', { id: b.dataset.settle }).then(function () { toast('Crédit marqué comme réglé'); return refresh(); }); }); }; });
  }).catch(function (e) { $('#hl').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
}

/* ===================== Menu « Plus » (mobile) ===================== */
function vMore(w) {
  w.innerHTML = head('Plus', 'Autres sections') + '<div class="grid" style="grid-template-columns:1fr 1fr">' +
    [['reappro', 'À acheter'], ['products', 'Produits et prix'], ['expenses', 'Dépenses'], ['reports', 'Rapports'], ['history', 'Historique']].map(function (n) { return '<button class="card" data-g="' + n[0] + '" style="display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px;cursor:pointer;color:var(--brand);font-weight:700">' + icon(n[0]).replace('<svg', '<svg style="width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:1.8"') + '<span style="color:var(--ink)">' + n[1] + '</span></button>'; }).join('') +
    '<button class="card" id="th2" style="padding:18px;cursor:pointer;grid-column:1/-1;font-weight:600">Basculer thème clair / sombre</button></div>';
  $$('[data-g]', w).forEach(function (b) { b.onclick = function () { go(b.dataset.g); }; });
  $('#th2', w).onclick = function () { $('#theme').click(); };
}

/* ===================== Démarrage ===================== */
buildNav(); go('home');
refresh().catch(function (e) {
  $('#main').innerHTML = '<div class="card"><h2>Connexion impossible</h2><p>' + esc(e.message) + '</p><button class="btn" onclick="location.reload()">Réessayer</button></div>';
});
</script>
</body>
</html>
