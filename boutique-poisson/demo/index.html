<!DOCTYPE html>
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">

<meta name="theme-color" content="#0b4f6c">
<title>Ma Poissonnerie</title>
<style>
:root{
  --bg:#f2f6f8; --card:#ffffff; --ink:#10252f; --muted:#5d7380; --line:#dbe5ea;
  --brand:#0b4f6c; --brand-ink:#ffffff; --brand-soft:#e1f0f6; --side:#0b4f6c;
  --sales:#0b4f6c; --profit:#f2994a; --net:#2a9d8f;
  --ok:#1f8a5b; --ok-bg:#dcf3e8; --warn:#a86400; --warn-bg:#fdecc8; --bad:#b3261e; --bad-bg:#fbdad6;
  --radius:14px; --shadow:0 1px 2px rgba(16,37,47,.06),0 6px 18px rgba(16,37,47,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1a21; --card:#132630; --ink:#e8f1f5; --muted:#93a9b4; --line:#244150;
    --brand:#3aa6cf; --brand-ink:#04222e; --brand-soft:#173543; --side:#0e2a37;
    --sales:#3aa6cf; --profit:#f5a65b; --net:#4cc3b3;
    --ok:#5fd19b; --ok-bg:#12372a; --warn:#f3be5e; --warn-bg:#3b2f10; --bad:#ff8f86; --bad-bg:#431b18;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0c1a21; --card:#132630; --ink:#e8f1f5; --muted:#93a9b4; --line:#244150;
  --brand:#3aa6cf; --brand-ink:#04222e; --brand-soft:#173543; --side:#0e2a37;
  --sales:#3aa6cf; --profit:#f5a65b; --net:#4cc3b3;
  --ok:#5fd19b; --ok-bg:#12372a; --warn:#f3be5e; --warn-bg:#3b2f10; --bad:#ff8f86; --bad-bg:#431b18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;padding:6px 10px 16px;font-weight:700;font-size:18px}
.logo svg{width:34px;height:34px;flex:none}
.side button.nav{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;border-radius:10px;background:transparent;color:inherit;cursor:pointer;text-align:left;font-weight:500;transition:background .2s,transform .1s}
.side button.nav:hover{background:rgba(255,255,255,.12)}
.side button.nav.on{background:rgba(255,255,255,.22);font-weight:700}
.side .sp{flex:1}
.nav svg,.bnav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
main{padding:22px 26px 40px;max-width:1180px;width:100%;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:26px}
.top .sub{color:var(--muted);font-size:14px}
.bnav{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card h2{font-size:17px;margin-bottom:4px}
.card .hint{color:var(--muted);font-size:13px;margin-bottom:10px}
.grid{display:grid;gap:14px}
.grid>*,.card{min-width:0}
main{min-width:0}
.app>main{overflow-x:clip}
.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kpi{position:relative;overflow:hidden}
.kpi .l{font-size:13px;color:var(--muted);font-weight:600}
.kpi .v{font-size:24px;white-space:nowrap;font-weight:800;margin-top:4px;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;font-weight:600;color:var(--muted)}
.kpi .d{font-size:12.5px;margin-top:2px;color:var(--muted)}
.kpi .d.up{color:var(--ok)} .kpi .d.down{color:var(--bad)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c,var(--brand))}
.two{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)} .three{grid-template-columns:repeat(3,minmax(0,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:11px;padding:11px 16px;background:var(--brand);color:var(--brand-ink);font-weight:700;cursor:pointer;transition:transform .08s,filter .2s,box-shadow .2s;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.btn:hover{filter:brightness(1.07)} .btn:active{transform:translateY(1px) scale(.98)}
.btn.sec{background:var(--brand-soft);color:var(--brand);box-shadow:none}
.btn.ghost{background:transparent;color:var(--brand);box-shadow:none;border:1px solid var(--line)}
.btn.danger{background:var(--bad-bg);color:var(--bad);box-shadow:none}
.btn.big{padding:15px 18px;font-size:17px;width:100%}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;pointer-events:none}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px}
label.f>span{display:block;margin-bottom:4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);outline:none;transition:border .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.row{display:flex;gap:10px;flex-wrap:wrap} .row>*{flex:1 1 140px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--card);padding:7px 13px;border-radius:99px;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted);transition:all .15s;white-space:nowrap}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.bas{background:var(--warn-bg);color:var(--warn)} .badge.rupture{background:var(--bad-bg);color:var(--bad)} .badge.neutre{background:var(--brand-soft);color:var(--muted)} .badge.neutral{background:var(--brand-soft);color:var(--brand)}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:hover td{background:color-mix(in srgb,var(--brand-soft) 45%,transparent)}
.scroll{overflow-x:auto}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pcard{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 11px;text-align:left;cursor:pointer;transition:transform .12s,box-shadow .2s,border .2s;display:flex;flex-direction:column;gap:3px;min-height:92px;animation:pop .35s both}
.pcard:hover{box-shadow:var(--shadow);border-color:var(--brand)} .pcard:active{transform:scale(.97)}
.pcard .nm{font-weight:700;font-size:14px;line-height:1.25}
.pcard .pr{color:var(--brand);font-weight:800}
.pcard .st{font-size:12px;color:var(--muted);margin-top:auto}
.pcard.out{opacity:.62}
.salewrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.salewrap>div{min-width:0}
.cart{position:sticky;top:14px}
.line{display:grid;grid-template-columns:1fr 70px 92px 28px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.line .nm{font-weight:600;font-size:14px}
.line input{padding:7px 8px;text-align:right}
.line .x{border:0;background:transparent;color:var(--bad);font-size:20px;cursor:pointer}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin-top:12px}
.sub2{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}
.empty{padding:26px;text-align:center;color:var(--muted)}
.cartbar{display:none}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#10252f;color:#fff;padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:99;max-width:92vw;animation:toast .35s both;font-weight:600}
.toast.err{background:var(--bad);color:#fff}
.modal{position:fixed;inset:0;background:rgba(5,20,28,.55);display:flex;align-items:flex-end;justify-content:center;z-index:60;animation:fade .2s both}
.modal .box{background:var(--card);width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px;animation:slide .28s both}
@media(min-width:700px){.modal{align-items:center}.modal .box{border-radius:20px}}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;font-weight:600;margin:4px 0 8px}
.legend i{display:inline-block;width:14px;height:14px;border:1px solid #000;margin-right:6px;vertical-align:-2px;border-radius:3px}
.hbar{display:grid;grid-template-columns:minmax(100px,32%) 1fr minmax(84px,auto);gap:10px;align-items:center;margin:7px 0;font-size:14px}
.hbar .t{background:var(--brand-soft);border-radius:6px;height:24px}
.hbar .b{height:100%;border:1px solid #000;border-radius:6px;transform-origin:left;animation:growx .7s both;min-width:2px}
.hbar .vl{font-weight:800;font-size:13.5px;text-align:right;white-space:nowrap}
.chart text{fill:var(--ink)} .chart .mut{fill:var(--muted)} .chart .gl{stroke:var(--line)} .chart .ax{stroke:var(--ink)}
.skel{background:linear-gradient(90deg,var(--line),var(--brand-soft),var(--line));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:10px;height:84px}
.alert{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.banner{background:var(--warn-bg);color:var(--warn);padding:8px 14px;border-radius:10px;font-weight:600;margin-bottom:14px;font-size:14px}
.view{animation:fade .35s backwards}
.kpis .card{animation:rise .5s both} .kpis .card:nth-child(2){animation-delay:.05s}.kpis .card:nth-child(3){animation-delay:.1s}.kpis .card:nth-child(4){animation-delay:.15s}.kpis .card:nth-child(5){animation-delay:.2s}.kpis .card:nth-child(6){animation-delay:.25s}
.bar rect.pos{transform-box:fill-box;transform-origin:bottom;animation:growy .7s both}
.bar rect.neg{transform-box:fill-box;transform-origin:top;animation:growy .7s both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes toast{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media(max-width:900px){
  .app{display:block}
  .side{display:none}
  main{padding:14px 14px 150px}
  .top h1{font-size:22px}
  .two,.three{grid-template-columns:minmax(0,1fr)}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:50;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.08)}
  .bnav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);padding:5px 0;cursor:pointer;border-radius:10px}
  .bnav button.on{color:var(--brand)}
  .salewrap{display:block}
  .cart{position:fixed;top:auto;left:0;right:0;bottom:0;z-index:70;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .3s;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .cart.open{transform:none}
  .cartbar{display:flex;position:fixed;left:12px;right:12px;bottom:76px;z-index:55;background:var(--brand);color:var(--brand-ink);border-radius:14px;padding:13px 16px;justify-content:space-between;font-weight:800;box-shadow:var(--shadow);border:0;cursor:pointer;animation:rise .3s both}
  .cartbar.hide{display:none}
  .toast{bottom:150px}
  .line{grid-template-columns:1fr 64px 84px 26px}
}
</style>

 *   update(table, id, patch) lock(fn)

 * enregistrés jusqu'à la date de la vente (somme des montants / somme des
 * quantités). À défaut d'achat, on utilise le prix d'achat de référence de la
 * fiche produit. Ce coût est figé dans la ligne de vente (la marge d'une
 * vente passée ne change donc plus).
 */

  ]

var EXPENSE_CATEGORIES = ['Électricité', 'Glace', 'Transport', 'Loyer', 'Salaires', 'Emballages',
  'Eau', 'Carburant / Gaz', 'Entretien / Réparations', 'Frais de téléphone', 'Taxes / Patente', 'Autres'];
var LOSS_REASONS = ['Poisson avarié', 'Décongélation', 'Casse', 'Péremption', 'Vol', 'Don / Consommation perso', 'Correction d\'inventaire'];
var PAYMENT_MODES = ['Espèces', 'Mobile Money', 'Crédit'];

function num_(v) {
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  var n = parseFloat(String(v == null ? '' : v).replace(/\s/g, '').replace(',', '.'));
  return isFinite(n) ? n : 0;
}
function round_(v, d) { var f = Math.pow(10, d === undefined ? 2 : d); return Math.round((v + 1e-12) * f) / f; }
function uid_(prefix) {
  return prefix + '-' + Date.now().toString(36).toUpperCase() + Math.floor(Math.random() * 1296).toString(36).toUpperCase();
}
function validDate_(s) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(s))) throw new Error('Date invalide : ' + s);
  var p = String(s).split('-').map(Number), d = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
  if (d.getUTCMonth() !== p[1] - 1) throw new Error('Date invalide : ' + s);
  return String(s);
}
function addDays_(s, n) {
  var p = s.split('-').map(Number), d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n));
  return d.toISOString().slice(0, 10);
}
function inRange_(d, from, to) { return d >= from && d <= to; }

/* ---------- Produits ---------- */

function listProducts_(store) {
  return store.all('Produits').map(function (p) {
    return {
      id: String(p.id), categorie: p.categorie, nom: p.nom, unite: p.unite,
      prixAchat: num_(p.prixAchat), prixVente: num_(p.prixVente), seuil: num_(p.seuil),
      actif: String(p.actif).toUpperCase() !== 'NON', kgSac: num_(p.kgSac)
    };
  });
}

function saveProduct_(store, p) {
  var nom = String(p.nom || '').trim();
  if (!nom) throw new Error('Le nom du produit est obligatoire.');
  var rec = {
    categorie: String(p.categorie || 'Autres').trim(), nom: nom, unite: String(p.unite || 'pièce').trim(),
    prixAchat: num_(p.prixAchat), prixVente: num_(p.prixVente), seuil: num_(p.seuil),
    actif: p.actif === false || String(p.actif).toUpperCase() === 'NON' ? 'NON' : 'OUI',
    kgSac: num_(p.kgSac) > 0 ? num_(p.kgSac) : ''
  };
  return store.lock(function () {
    if (p.id) { store.update('Produits', p.id, rec); rec.id = p.id; }
    else {
      var all = store.all('Produits');
      var max = all.reduce(function (m, x) { var n = parseInt(String(x.id).replace(/\D/g, ''), 10); return n > m ? n : m; }, 0);
      rec.id = 'P' + ('000' + (max + 1)).slice(-4);
      store.append('Produits', rec);
    }
    return rec;
  });
}

function findProduct_(store, id) {
  var list = listProducts_(store);
  for (var i = 0; i < list.length; i++) if (list[i].id === String(id)) return list[i];
  throw new Error('Produit introuvable : ' + id);
}

/* ---------- Coût moyen et stock ---------- */

function unitCost_(achats, product, upToDate) {
  var q = 0, t = 0;
  achats.forEach(function (a) {
    if (String(a.produitId) === product.id && (!upToDate || String(a.date) <= upToDate)) {
      q += num_(a.qte); t += num_(a.qte) * num_(a.pu);
    }
  });
  return q > 0 ? t / q : product.prixAchat;
}

function stockTable_(store) {
  var products = listProducts_(store), map = {}, achats = store.all('Achats');
  products.forEach(function (p) { map[p.id] = { p: p, in: 0, out: 0, lost: 0, cost: 0 }; });
  achats.forEach(function (a) { var m = map[String(a.produitId)]; if (m) m.in += num_(a.qte); });
  store.all('Ventes').forEach(function (v) { var m = map[String(v.produitId)]; if (m) m.out += num_(v.qte); });
  store.all('Pertes').forEach(function (v) { var m = map[String(v.produitId)]; if (m) m.lost += num_(v.qte); });
  return products.map(function (p) {
    var m = map[p.id], qte = round_(m.in - m.out - m.lost, 3), cout = unitCost_(achats, p);
    var status = (!m.in && !m.out && !m.lost) ? 'neutre' : (qte <= 0 ? 'rupture' : (p.seuil > 0 && qte <= p.seuil ? 'bas' : 'ok'));
    return {
      id: p.id, categorie: p.categorie, nom: p.nom, unite: p.unite, actif: p.actif,
      prixVente: p.prixVente, prixAchat: p.prixAchat, seuil: p.seuil, kgSac: p.kgSac,
      sacs: p.kgSac > 0 ? round_(qte / p.kgSac, 2) : null,
      entrees: round_(m.in, 3), sorties: round_(m.out, 3), pertes: round_(m.lost, 3),
      stock: qte, coutMoyen: round_(cout, 2), valeur: round_(Math.max(qte, 0) * cout, 0), statut: status
    };
  });
}

/* ---------- Écritures ---------- */

function addSale_(store, d) {
  var date = validDate_(d.date), lines = d.lines || [];
  if (!lines.length) throw new Error('Le panier est vide.');
  var payment = PAYMENT_MODES.indexOf(d.paiement) >= 0 ? d.paiement : 'Espèces';
  return store.lock(function () {
    var products = listProducts_(store), achats = store.all('Achats'), stock = {}, warnings = [], total = 0, margin = 0;
    stockTable_(store).forEach(function (s) { stock[s.id] = s.stock; });
    var batch = uid_('V');
    lines.forEach(function (l, i) {
      var p = products.filter(function (x) { return x.id === String(l.produitId); })[0];
      if (!p) throw new Error('Produit introuvable : ' + l.produitId);
      var qte = num_(l.qte), pu = num_(l.pu);
      if (qte <= 0) throw new Error('Quantité invalide pour ' + p.nom);
      if (pu < 0) throw new Error('Prix invalide pour ' + p.nom);
      var cout = round_(unitCost_(achats, p, date), 2);
      if (stock[p.id] - qte < 0) warnings.push(p.nom + ' : stock insuffisant (' + stock[p.id] + ' ' + p.unite + ' enregistré).');
      stock[p.id] -= qte;
      store.append('Ventes', {
        id: batch + '-' + (i + 1), date: date, produitId: p.id, produit: p.nom, categorie: p.categorie,
        qte: qte, pu: pu, ca: round_(qte * pu, 0), cout: cout, marge: round_(qte * (pu - cout), 0),
        paiement: payment, note: String(d.note || '')
      });
      total += qte * pu; margin += qte * (pu - cout);
    });
    return { id: batch, total: round_(total, 0), marge: round_(margin, 0), warnings: warnings };
  });
}

/**
 * Achat. Deux saisies possibles :
 *  - au poids : qte + (pu | montant)
 *  - par sacs / cartons : nbSacs + kgSac (+ prixKg via pu, | prixSac | montant).
 * La quantité enregistrée est toujours dans l'unité du produit (kg pour les produits au kilo).
 */
function addPurchase_(store, d) {
  var date = validDate_(d.date), p = findProduct_(store, d.produitId);
  var nbSacs = num_(d.nbSacs), kgSac = num_(d.kgSac), qte, montant = num_(d.montant), pu = num_(d.pu);
  if (nbSacs > 0) {
    if (!(kgSac > 0)) throw new Error('Indiquez le poids (kg) d\'un sac ou carton.');
    qte = round_(nbSacs * kgSac, 3);
    if (num_(d.prixSac) > 0) pu = num_(d.prixSac) / kgSac;
  } else { nbSacs = 0; kgSac = 0; qte = num_(d.qte); }

var NAV = [['home', 'Accueil'], ['sell', 'Vendre'], ['buy', 'Achats'], ['stock', 'Stock'], ['products', 'Produits'], ['expenses', 'Dépenses'], ['reports', 'Rapports'], ['history', 'Historique']];

function go(v) {

  $$('#bnav [data-v]').forEach(function (b) { b.classList.toggle('on', b.dataset.v === v || (sub && b.dataset.v === 'more')); });
  window.scrollTo(0, 0); render();
}
function render() {
  var v = S.view, m = $('#main');
  if (!S.data) { m.innerHTML = '<div class="skel"></div>'; return; }
  var fn = { home: vHome, sell: vSell, buy: vBuy, stock: vStock, products: vProducts, expenses: vExpenses, reports: vReports, history: vHistory, more: vMore }[v];
  m.innerHTML = ''; var wrap = document.createElement('div'); wrap.className = 'view'; m.appendChild(wrap);
  fn(wrap);
}
function head(title, sub, right) {
  return '<div class="top"><div><h1>' + title + '</h1>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>' + (right || '') + '</div>';
}
function refresh(keepView) {
  return api('bootstrap', { today: today() }).then(function (d) { S.data = d; if (!keepView) render(); return d; });
}
function prodById(id) { return S.data.produits.filter(function (p) { return p.id === id; })[0]; }
function stockById(id) { return S.data.stock.filter(function (p) { return p.id === id; })[0]; }
function dateInput(id, val) { return '<input type="date" id="' + id + '" value="' + val + '">'; }

  var week = aggregate(d.semaine.jours.length ? fillDays(d.semaine.jours, addDays(d.today, -6), d.today) : fillDays([], addDays(d.today, -6), d.today));

      '<div class="card"><h2>Alertes stock</h2><div class="hint">Produits en rupture ou sous le seuil</div>' +

      '<div class="card"><h2>Ce mois-ci</h2><div class="hint">Du 1er au ' + frShort(d.today) + '</div>' +

function kpi(label, value, color, extra) {
  return '<div class="card kpi" style="--c:' + color + '"><div class="l">' + label + '</div><div class="v" data-v="' + value + '">' + moneyHtml(value) + '</div>' + (extra || '') + '</div>';
}
function fillDays(days, from, to) {
  var map = {}; days.forEach(function (d) { map[d.date] = d; });
  var out = [], c = from; while (c <= to) { out.push(map[c] || { date: c, ca: 0, marge: 0, depenses: 0, pertes: 0, net: 0 }); c = addDays(c, 1); }
  return out;
}

/* ===================== Vendre ===================== */
function vSell(w) {
  var cats = ['Toutes'].concat(S.data.categories);

    '<div class="salewrap"><div>' +
    '<input id="q" placeholder="🔍 Rechercher un produit (ex : tilapia, riz, glace…)" value="' + esc(S.q) + '" style="margin-bottom:10px">' +
    '<div class="chips" id="cats">' + cats.map(function (c) { return '<button class="chip' + (S.cat === c ? ' on' : '') + '" data-c="' + esc(c) + '">' + esc(c) + '</button>'; }).join('') + '</div>' +
    '<div class="pgrid" id="pg"></div></div>' +
    '<div class="card cart" id="cart"></div></div>' +
    '<button class="cartbar hide" id="cbar"></button>';
  $('#sdate').onchange = function (e) { S.saleDate = e.target.value || today(); };
  $('#q').oninput = function (e) { S.q = e.target.value; drawGrid(); };
  $$('#cats .chip').forEach(function (b) { b.onclick = function () { S.cat = b.dataset.c; $$('#cats .chip').forEach(function (x) { x.classList.toggle('on', x === b); }); drawGrid(); }; });
  $('#cbar').onclick = function () { S.cartOpen = true; drawCart(); };
  drawGrid(); drawCart();
}
function drawGrid() {
  var q = norm(S.q), list = S.data.stock.filter(function (p) { return p.actif && (S.cat === 'Toutes' || p.categorie === S.cat) && (!q || norm(p.nom + ' ' + p.categorie).indexOf(q) >= 0); });
  var g = $('#pg'); if (!g) return;
  if (!list.length) { g.innerHTML = '<div class="empty" style="grid-column:1/-1">Aucun produit trouvé.</div>'; return; }
  g.innerHTML = list.slice(0, 120).map(function (p, i) {
    return '<button class="pcard' + (p.stock <= 0 ? ' out' : '') + '" data-id="' + p.id + '" style="animation-delay:' + Math.min(i, 20) * 12 + 'ms"><span class="nm">' + esc(p.nom) + '</span>' +
      '<span class="pr">' + (p.prixVente ? money(p.prixVente) + '<small style="font-weight:500;color:var(--muted)"> / ' + esc(p.unite) + '</small>' : '<small style="color:var(--bad)">Prix à renseigner</small>') + '</span>' +
      '<span class="st">Stock : ' + qty(p.stock) + ' ' + esc(p.unite) + '</span></button>';
  }).join('') + (list.length > 120 ? '<div class="empty" style="grid-column:1/-1">Affinez la recherche pour voir les ' + (list.length - 120) + ' autres produits.</div>' : '');
  $$('.pcard', g).forEach(function (b) { b.onclick = function () { addToCart(b.dataset.id); }; });
}
function addToCart(id) {
  var p = prodById(id), ex = S.cart.filter(function (l) { return l.id === id; })[0];
  if (ex) ex.qte = +(ex.qte + 1).toFixed(3); else S.cart.push({ id: id, qte: 1, pu: p.prixVente || 0 });
  if (!ex && !p.prixVente) S.cartOpen = true;
  drawCart();
  if (!ex && !p.prixVente) setTimeout(function () { var i2 = $('.line[data-id="' + id + '"] .pu'); if (i2) i2.focus(); }, 80);
}
function cartTotals() {
  var t = 0, m = 0;
  S.cart.forEach(function (l) { var s = stockById(l.id); t += l.qte * l.pu; m += l.qte * (l.pu - (s ? s.coutMoyen : 0)); });
  return { total: t, marge: m, n: S.cart.length };
}
function drawCart() {
  var c = $('#cart'); if (!c) return;

  c.classList.toggle('open', S.cartOpen);
  var bar = $('#cbar'); bar.classList.toggle('hide', !S.cart.length || S.cartOpen);
  bar.innerHTML = '<span>🛒 ' + t.n + ' article' + (t.n > 1 ? 's' : '') + '</span><span>' + money(t.total) + '</span>';
  c.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center"><h2>Panier</h2>' + (window.innerWidth <= 900 ? '<button class="btn sm ghost" id="cclose">Fermer ✕</button>' : '') + '</div>' +
    (S.cart.length ? '<div class="hint">Quantité et prix modifiables</div>' + S.cart.map(function (l) {
      var p = prodById(l.id);
      return '<div class="line" data-id="' + l.id + '"><div class="nm">' + esc(p.nom) + '<div style="font-size:12px;color:var(--muted);font-weight:400">' + esc(p.unite) + '</div></div>' +
        '<input class="qt" type="number" inputmode="decimal" step="any" min="0" value="' + l.qte + '" aria-label="Quantité"><input class="pu" type="number" inputmode="decimal" step="any" min="0" value="' + l.pu + '" aria-label="Prix unitaire"><button class="x" aria-label="Retirer">×</button></div>';
    }).join('') +
    '<div class="chips" style="margin-top:12px">' + S.data.paiements.map(function (p) { return '<button class="chip' + (S.pay === p ? ' on' : '') + '" data-p="' + esc(p) + '">' + esc(p) + '</button>'; }).join('') + '</div>' +
    '<input id="cnote" placeholder="Client / note (facultatif)" value="' + esc(S.note) + '">' +
    '<div class="sub2" style="margin-top:12px"><span>Bénéfice estimé</span><b id="cprofit" style="color:' + (t.marge >= 0 ? 'var(--ok)' : 'var(--bad)') + '">' + money(t.marge) + '</b></div>' +
    '<div class="tot"><span>Total</span><span id="ctot">' + money(t.total) + '</span></div>' +
    '<button class="btn big" id="csave" style="margin-top:12px">Enregistrer la vente</button>' +
    '<button class="btn ghost sm" id="cclear" style="margin-top:8px;width:100%">Vider le panier</button>'
    : '<div class="empty">Panier vide.<br>Touchez un produit pour commencer.</div>');
  var cc = $('#cclose', c); if (cc) cc.onclick = function () { S.cartOpen = false; drawCart(); };
  $$('.line', c).forEach(function (row) {
    var l = S.cart.filter(function (x) { return x.id === row.dataset.id; })[0];
    $('.qt', row).oninput = function (e) { l.qte = parseFloat(String(e.target.value).replace(',', '.')) || 0; softTotals(); };
    $('.pu', row).oninput = function (e) { l.pu = parseFloat(String(e.target.value).replace(',', '.')) || 0; softTotals(); };

  });
  $$('[data-p]', c).forEach(function (b) { b.onclick = function () { S.pay = b.dataset.p; drawCart(); }; });

  var cs = $('#csave', c); if (cs) cs.onclick = function () {
    if (S.cart.some(function (l) { return !(l.qte > 0); })) return toast('Vérifiez les quantités du panier.', true);

    busy(cs, function () {
      return api('addSale', { date: S.saleDate, paiement: S.pay, note: S.note, lines: S.cart.map(function (l) { return { produitId: l.id, qte: l.qte, pu: l.pu }; }) }).then(function (r) {
        S.cart = []; S.note = ''; S.cartOpen = false;
        toast('✅ Vente enregistrée : ' + money(r.total) + ' (bénéfice ' + money(r.marge) + ')');
        if (r.warnings && r.warnings.length) setTimeout(function () { toast('⚠️ ' + r.warnings.join(' '), true); }, 2800);

}
function softTotals() {
  var t = cartTotals(); var el = $('#ctot'); if (el) el.textContent = money(t.total);
  var pf = $('#cprofit'); if (pf) { pf.textContent = money(t.marge); pf.style.color = t.marge >= 0 ? 'var(--ok)' : 'var(--bad)'; }
  var bar = $('#cbar'); if (bar) bar.innerHTML = '<span>🛒 ' + t.n + ' article' + (t.n > 1 ? 's' : '') + '</span><span>' + money(t.total) + '</span>';
}

/* ===================== Achats ===================== */
function productOptions(selected, q) {
  var byCat = {}; q = norm(q || '');
  S.data.produits.filter(function (p) { return p.actif && (!q || norm(p.nom).indexOf(q) >= 0 || p.id === selected); }).forEach(function (p) { (byCat[p.categorie] = byCat[p.categorie] || []).push(p); });
  return '<option value="">Choisir un produit…</option>' + Object.keys(byCat).map(function (c) {
    return '<optgroup label="' + esc(c) + '">' + byCat[c].map(function (p) { return '<option value="' + p.id + '"' + (p.id === selected ? ' selected' : '') + '>' + esc(p.nom) + ' (' + esc(p.unite) + ')</option>'; }).join('') + '</optgroup>';
  }).join('');
}
function vBuy(w) {
  var mode = 'sacs', basis = 'kg';   // mode : sacs | poids ; basis : kg | sac | total (sacs) ou unit | total (poids)
  w.innerHTML = head('Achats / Approvisionnement', 'Enregistrez chaque achat : le stock et le coût moyen se mettent à jour') +
    '<div class="grid two"><div class="card"><h2>Nouvel achat</h2>' +
    '<label class="f"><span>Produit</span><input id="bq" placeholder="Filtrer la liste…" style="margin-bottom:6px"><select id="bp">' + productOptions('') + '</select></label>' +
    '<label class="f"><span>Date</span>' + dateInput('bd', today()) + '</label>' +
    '<div class="chips"><button class="chip on" id="mm1">Par sacs / cartons</button><button class="chip" id="mm2">Au poids / à l\'unité</button></div>' +
    '<div id="bform"></div>' +
    '<label class="f"><span>Nouveau prix de vente (facultatif)</span><input id="bsell" type="number" inputmode="decimal" step="any" min="0"></label>' +
    '<label class="f"><span>Fournisseur</span><input id="bsup" list="sups" placeholder="Nom du fournisseur"><datalist id="sups"></datalist></label>' +
    '<div class="card" style="background:var(--brand-soft);box-shadow:none;margin:6px 0 10px" id="bsum"></div>' +
    '<button class="btn big" id="bsave">Enregistrer l\'achat</button></div>' +
    '<div class="card"><h2>Derniers achats</h2><div class="hint">30 derniers jours</div><div id="blist" class="scroll"><div class="skel"></div></div></div></div>';
  var kgPref = '';
  function formHtml() {
    if (mode === 'sacs') {
      return '<div class="row"><label class="f"><span>Nombre de sacs / cartons</span><input id="bn" type="number" inputmode="decimal" step="any" min="0" placeholder="ex : 10"></label>' +
        '<label class="f"><span>Poids d\'un sac (kg)</span><input id="bk" type="number" inputmode="decimal" step="any" min="0" placeholder="ex : 25" value="' + kgPref + '"></label></div>' +
        '<div class="chips"><button class="chip' + (basis === 'kg' ? ' on' : '') + '" data-b="kg">Prix au kilo</button><button class="chip' + (basis === 'sac' ? ' on' : '') + '" data-b="sac">Prix du sac</button><button class="chip' + (basis === 'total' ? ' on' : '') + '" data-b="total">Total payé</button></div>' +
        '<label class="f"><span>' + ({ kg: 'Prix d\'achat au kilo (FCFA)', sac: 'Prix d\'un sac (FCFA)', total: 'Montant total payé (FCFA)' }[basis]) + '</span><input id="bpu" type="number" inputmode="decimal" step="any" min="0"></label>';
    }
    return '<label class="f"><span>Quantité achetée</span><input id="bqty" type="number" inputmode="decimal" step="any" min="0"></label>' +
      '<div class="chips"><button class="chip' + (basis === 'unit' ? ' on' : '') + '" data-b="unit">Prix unitaire</button><button class="chip' + (basis === 'total' ? ' on' : '') + '" data-b="total">Total payé</button></div>' +
      '<label class="f"><span>' + (basis === 'unit' ? 'Prix d\'achat unitaire (FCFA)' : 'Montant total payé (FCFA)') + '</span><input id="bpu" type="number" inputmode="decimal" step="any" min="0"></label>';
  }
  function bindForm() {
    $('#bform').innerHTML = formHtml();
    $$('#bform [data-b]').forEach(function (b) { b.onclick = function () { var keep = readRaw(); basis = b.dataset.b; bindForm(); restore(keep); calc(); }; });
    $$('#bform input').forEach(function (i) { i.oninput = calc; });
    calc();
  }
  function readRaw() { var o = {}; $$('#bform input').forEach(function (i) { o[i.id] = i.value; }); return o; }
  function restore(o) { Object.keys(o).forEach(function (k) { var e = $('#' + k); if (e && k !== 'bpu') e.value = o[k]; }); }
  function val(id) { var e = $('#' + id); return e ? (parseFloat(String(e.value).replace(',', '.')) || 0) : 0; }
  function parts() {
    var p = prodById($('#bp').value), v = val('bpu'), out = { p: p, qte: 0, pu: 0, montant: 0, nb: 0, kg: 0 };
    if (mode === 'sacs') {
      out.nb = val('bn'); out.kg = val('bk'); out.qte = out.nb * out.kg;
      if (basis === 'kg') out.pu = v; else if (basis === 'sac') out.pu = out.kg ? v / out.kg : 0; else out.pu = out.qte ? v / out.qte : 0;
    } else {
      out.qte = val('bqty'); out.pu = basis === 'unit' ? v : (out.qte ? v / out.qte : 0);

  function calc() {

/* ===================== Rapports ===================== */
function presetRange(k) {
  var t = today(), d = parse(t);
  if (k === '1') return [t, t];
  if (k === '7') return [addDays(t, -6), t];
  if (k === 'm') return [t.slice(0, 8) + '01', t];
  if (k === 'pm') { var a = new Date(d.getFullYear(), d.getMonth() - 1, 1), b = new Date(d.getFullYear(), d.getMonth(), 0); return [ymd(a), ymd(b)]; }
  if (k === '30') return [addDays(t, -29), t];
  if (k === 'y') return [d.getFullYear() + '-01-01', t];
  return [S.rep.from, S.rep.to];
}

        '<div class="card" style="margin-top:14px"><h2>Évolution par ' + ag.unit + '</h2><div class="hint">Chiffre d\'affaires, bénéfice brut et bénéfice net (FCFA)</div>' +
          barChart(ag.labels, [{ name: "Chiffre d'affaires", color: 'var(--sales)', values: ag.rows.map(function (x) { return x.ca; }) }, { name: 'Bénéfice brut', color: 'var(--profit)', values: ag.rows.map(function (x) { return x.marge; }) }, { name: 'Bénéfice net', color: 'var(--net)', values: ag.rows.map(function (x) { return x.net; }) }], { title: 'Évolution' }) + '</div>' +
        '<div class="grid two" style="margin-top:14px"><div class="card"><h2>Produits les plus rentables</h2><div class="hint">Bénéfice brut (FCFA)</div>' + hBars(r.produits.slice().sort(function (a, b) { return b.marge - a.marge; }).slice(0, 8), 'var(--profit)', 'marge', 'produit', T.marge) + '</div>' +
        '<div class="card"><h2>Chiffre d\'affaires par catégorie</h2><div class="hint">FCFA</div>' + hBars(r.categories.slice(0, 8), 'var(--sales)', 'ca', 'categorie', T.ca) + '</div></div>' +
        '<div class="card scroll" style="margin-top:14px"><h2>Détail par produit</h2><table><thead><tr><th>Produit</th><th class="n">Quantité</th><th class="n">CA</th><th class="n">Bénéfice</th><th class="n">Marge</th><th class="n">Part du CA</th></tr></thead><tbody>' +
          (r.produits.length ? r.produits.map(function (p) { return '<tr><td>' + esc(p.produit) + '</td><td class="n">' + qty(p.qte) + '</td><td class="n">' + nf.format(p.ca) + '</td><td class="n"><b>' + nf.format(p.marge) + '</b></td><td class="n">' + (p.ca ? Math.round(p.marge / p.ca * 100) : 0) + ' %</td><td class="n">' + (T.ca ? Math.round(p.ca / T.ca * 100) : 0) + ' %</td></tr>'; }).join('') : '<tr><td colspan="6" class="empty">Aucune vente sur la période.</td></tr>') + '</tbody></table></div>' +
        (r.paiements.length ? '<div class="card" style="margin-top:14px"><h2>Modes de paiement</h2><div class="hint">Chiffre d\'affaires (FCFA)</div>' + hBars(r.paiements, 'var(--net)', 'ca', 'mode', T.ca) + '</div>' : '');
      $$('#rbody .kpi .v').forEach(function (el) { countUp(el, +el.dataset.v); });
    }).catch(function (e) { $('#rbody').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
  }
  load();
}
function daysBetween(a, b) { return Math.round((parse(b) - parse(a)) / 864e5); }

/* ===================== Historique ===================== */
function vHistory(w) {
  var H = S.hist, T = [['Ventes', 'Ventes'], ['Achats', 'Achats'], ['Depenses', 'Dépenses'], ['Pertes', 'Pertes']];
  w.innerHTML = head('Historique', 'Consulter, corriger (supprimer puis ressaisir) ou régler un crédit') +
    '<div class="chips">' + T.map(function (t) { return '<button class="chip' + (H.table === t[0] ? ' on' : '') + '" data-t="' + t[0] + '">' + t[1] + '</button>'; }).join('') + '</div>' +
    '<div class="row" style="margin-bottom:10px"><label class="f"><span>Du</span>' + dateInput('hf', H.from) + '</label><label class="f"><span>Au</span>' + dateInput('ht', H.to) + '</label>' +
    (H.table === 'Ventes' ? '<label class="f"><span>Filtre</span><select id="hc"><option value="0">Toutes les ventes</option><option value="1"' + (H.credit ? ' selected' : '') + '>Crédits non réglés</option></select></label>' : '') + '</div>' +
    '<div class="card scroll" id="hl"><div class="skel"></div></div>';
  $$('[data-t]', w).forEach(function (b) { b.onclick = function () { H.table = b.dataset.t; vHistory(w); }; });
  $('#hf').onchange = function () { H.from = this.value; vHistory(w); }; $('#ht').onchange = function () { H.to = this.value; vHistory(w); };
  var hc = $('#hc'); if (hc) hc.onchange = function () { H.credit = this.value === '1'; vHistory(w); };
  var cols = {
    Ventes: [['Date', function (r) { return frShort(r.date); }], ['Produit', function (r) { return esc(r.produit) + (r.note ? '<div style="font-size:12px;color:var(--muted)">' + esc(r.note) + '</div>' : ''); }], ['Qté', function (r) { return qty(r.qte); }, 1], ['PU', function (r) { return nf.format(r.pu); }, 1], ['Total', function (r) { return '<b>' + nf.format(r.qte * r.pu) + '</b>'; }, 1], ['Bénéf.', function (r) { return nf.format(r.qte * (r.pu - r.cout)); }, 1], ['Paiement', function (r) { return r.paiement === 'Crédit' ? '<span class="badge bas">Crédit</span>' : esc(r.paiement); }]],
    Achats: [['Date', function (r) { return frShort(r.date); }], ['Produit', function (r) { return esc(r.produit) + (r.fournisseur ? '<div style="font-size:12px;color:var(--muted)">' + esc(r.fournisseur) + '</div>' : ''); }], ['Sacs', function (r) { return r.nbSacs ? qty(r.nbSacs) + ' × ' + qty(r.kgSac) + ' kg' : '—'; }], ['Qté', function (r) { return qty(r.qte); }, 1], ['PU', function (r) { return nf1.format(r.pu); }, 1], ['Total', function (r) { return '<b>' + nf.format(r.qte * r.pu) + '</b>'; }, 1]],
    Depenses: [['Date', function (r) { return frShort(r.date); }], ['Catégorie', function (r) { return esc(r.categorie); }], ['Libellé', function (r) { return esc(r.libelle); }], ['Montant', function (r) { return '<b>' + nf.format(r.montant) + '</b>'; }, 1]],
    Pertes: [['Date', function (r) { return frShort(r.date); }], ['Produit', function (r) { return esc(r.produit); }], ['Qté', function (r) { return qty(r.qte); }, 1], ['Motif', function (r) { return esc(r.motif); }], ['Valeur', function (r) { return '<b>' + nf.format(r.qte * r.cout) + '</b>'; }, 1]]
  }[H.table];
  api('history', { table: H.table, from: H.from, to: H.to }).then(function (rows) {
    if (H.table === 'Ventes' && H.credit) rows = rows.filter(function (r) { return r.paiement === 'Crédit'; });
    $('#hl').innerHTML = rows.length ? '<table><thead><tr>' + cols.map(function (c) { return '<th class="' + (c[2] ? 'n' : '') + '">' + c[0] + '</th>'; }).join('') + '<th></th></tr></thead><tbody>' +
      rows.map(function (r) { return '<tr>' + cols.map(function (c) { return '<td class="' + (c[2] ? 'n' : '') + '">' + c[1](r) + '</td>'; }).join('') + '<td style="white-space:nowrap">' + (H.table === 'Ventes' && r.paiement === 'Crédit' ? '<button class="btn sm sec" data-settle="' + r.id + '">Réglé</button> ' : '') + '<button class="btn sm danger" data-del="' + r.id + '">Suppr.</button></td></tr>'; }).join('') + '</tbody></table>' + (rows.length >= 500 ? '<div class="empty">Affichage limité aux 500 plus récents : réduisez la période.</div>' : '') : '<div class="empty">Aucun enregistrement sur la période.</div>';
    $$('[data-del]', w).forEach(function (b) { b.onclick = function () { if (confirm('Supprimer définitivement cet enregistrement ? Le stock et les bénéfices seront recalculés.')) busy(b, function () { return api('remove', { table: H.table, id: b.dataset.del }).then(function () { toast('Supprimé'); return refresh(); }); }); }; });
    $$('[data-settle]', w).forEach(function (b) { b.onclick = function () { busy(b, function () { return api('settleCredit', { id: b.dataset.settle }).then(function () { toast('Crédit marqué comme réglé'); return refresh(); }); }); }; });
  }).catch(function (e) { $('#hl').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
}

/* ===================== Menu « Plus » (mobile) ===================== */
function vMore(w) {
  w.innerHTML = head('Plus', 'Autres sections') + '<div class="grid" style="grid-template-columns:1fr 1fr">' +
    [['products', 'Produits et prix'], ['expenses', 'Dépenses'], ['reports', 'Rapports'], ['history', 'Historique']].map(function (n) { return '<button class="card" data-g="' + n[0] + '" style="display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px;cursor:pointer;color:var(--brand);font-weight:700">' + icon(n[0]).replace('<svg', '<svg style="width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:1.8"') + '<span style="color:var(--ink)">' + n[1] + '</span></button>'; }).join('') +
    '<button class="card" id="th2" style="padding:18px;cursor:pointer;grid-column:1/-1;font-weight:600">Basculer thème clair / sombre</button></div>';
  $$('[data-g]', w).forEach(function (b) { b.onclick = function () { go(b.dataset.g); }; });
  $('#th2', w).onclick = function () { $('#theme').click(); };
}

/* ===================== Démarrage ===================== */
buildNav(); go('home');
refresh().catch(function (e) {
  $('#main').innerHTML = '<div class="card"><h2>Connexion impossible</h2><p>' + esc(e.message) + '</p><button class="btn" onclick="location.reload()">Réessayer</button></div>';
});
</script>
</body>
</html>
